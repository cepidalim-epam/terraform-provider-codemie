version: 2
before:
  hooks:
    - go mod tidy
builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, windows, darwin, freebsd]
    goarch: [amd64, arm64]
    ldflags: -s -w -X main.version={{.Version}}
archives:
  - formats: [zip]
checksum:
  name_template: terraform-provider-codemie_{{.Version}}_SHA256SUMS
signs:
  - artifacts: checksum
changelog:
  use: git