name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check formatting
        run: |
          test -z "$(gofmt -l main.go internal)" || (echo "Unformatted files found:" && gofmt -l main.go internal && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -cover ./...
